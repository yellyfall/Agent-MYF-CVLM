services:
  - type: web
    name: myf-candidature-frontend
    runtime: static
    buildCommand: "node -e \"console.log('Frontend original prêt')\""
    staticPublishPath: ./public
    routes:
      - type: rewrite
        source: /api/*
        destination: https://46-224-141-132.sslip.io/api/*
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
